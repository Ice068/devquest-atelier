name: CI — Quality, Security & Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-lint-security-test:
    name: Backend Lint, SAST & Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint check
        run: ruff check app tests

      - name: Bandit SAST security scan
        run: bandit -r app -ll

      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt

      - name: Run pytest with coverage
        env:
          ENVIRONMENT: test
          STORAGE_BACKEND: memory
          SECRET_KEY: "ci-test-secret-key-with-more-than-thirty-two-characters"
        run: pytest --cov=app --cov-report=term-missing

  frontend-syntax-check:
    name: Frontend JS Syntax & Safety Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate ES module syntax
        run: |
          for file in frontend/static/js/*.js; do
            echo "Checking $file"
            node --check "$file"
          done

  docker-build:
    name: Docker Image Build Verification
    runs-on: ubuntu-latest
    needs: [backend-lint-security-test, frontend-syntax-check]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build production Docker image
        run: docker build -t devquest-atelier:ci .
